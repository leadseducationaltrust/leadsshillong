<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | LEADS Higher Secondary School</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1E3A8A">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
      color: #0f172a;
    }
    .card {
      max-width: 520px;
      margin: 1rem;
      padding: 1.5rem;
      border-radius: 16px;
      background: #ffffff;
      border: 1px solid #dbeafe;
      box-shadow: 0 18px 40px -28px rgba(30, 58, 138, 0.8);
      text-align: center;
    }
    .brand {
      color: #1e3a8a;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    h1 {
      margin: 0.4rem 0 0.8rem;
      font-size: 1.5rem;
      line-height: 1.3;
    }
    p {
      margin: 0;
      color: #334155;
      line-height: 1.6;
    }
    .actions {
      margin-top: 1.2rem;
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    a,
    button {
      border: 0;
      border-radius: 999px;
      padding: 0.65rem 1rem;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
    }
    a {
      background: #1e3a8a;
      color: #fff;
    }
    button {
      background: #e2e8f0;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">LEADS School</div>
    <h1>You are offline right now</h1>
    <p>The page could not be loaded because your device has no internet connection. Please reconnect and try again.</p>
    <div class="actions">
      <a href="/index.html">Go To Home</a>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </div>
  </main>
</body>
</html>
